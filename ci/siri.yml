name: Validate optional Siri module
# Manual: hosted image availability of Xcode 27 varies. No personal runner is used.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  siri:
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/siri
    steps:
      - uses: actions/checkout@v4
      - name: Select a hosted Xcode 27 toolchain
        shell: bash
        run: |
          for candidate in /Applications/Xcode_27*.app /Applications/Xcode\ 27*.app; do
            if [ -d "$candidate/Contents/Developer" ]; then
              echo "DEVELOPER_DIR=$candidate/Contents/Developer" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo 'This hosted image has no Xcode 27. Use the documented local build; do not connect a personal runner.' >&2
          exit 1
      - run: swift test -j 2
      - name: Build without signing or installation
        run: >-
          xcodebuild -project SecondBrainSiri.xcodeproj -scheme SecondBrainSiri
          -configuration Debug -derivedDataPath "$RUNNER_TEMP/SecondBrainBuild"
          CODE_SIGNING_ALLOWED=NO
          SECOND_BRAIN_SERVER_URL=https://second-brain.invalid
          -quiet build
